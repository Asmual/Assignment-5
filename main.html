<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- TailWind CDN DaisyUI CDN-->
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <!-- font awsome CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <!-- Google font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">

  <title>Assigmnet-5</title>
  <style>
    * {
      font-family: "Geist", sans-serif;
    }
  </style>
</head>
<body class="bg-[#F8F9FB] min-h-screen">

  <nav class="bg-white border-b border-gray-200 px-8 py-3 flex items-center justify-between shadow-sm">
    <div class="flex items-center space-x-3">
      <i class="fa-brands fa-github text-3xl text-[#1F2937]"></i>
      <h1 class="text-xl font-bold text-gray-800 tracking-tight">GitHub Issues Tracker</h1>
    </div>

    <div class="flex items-center space-x-4">
      <div class="relative">
        <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
          <i class="fa-solid fa-magnifying-glass text-sm"></i>
        </span>
        <input type="text" placeholder="Search issues..."
          class="pl-10 pr-4 py-2 w-[300px] border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm transition-all">
      </div>
      <button
        class="bg-[#4F46E5] hover:bg-[#4338CA] text-white px-4 py-2 rounded-lg font-semibold text-sm flex items-center transition-colors cursor-pointer">
        <i class="fa-solid fa-plus mr-2"></i> New Issue
      </button>
    </div>
  </nav>

  

</body>
</html>
